services:
    frontend:
        build: 
            context : ../HotelSystemFE
        container_name : hotel-frontend
        restart : unless-stopped
        ports:
            - "127.0.0.1:8081:80"

    backend:
        build:
            context : ../ComplexHotelSystem
        container_name : hotel-backend
        restart : unless-stopped
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hoteldb
            SPRING_DATASOURCE_USERNAME: hoteluser
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
            
            SPRING_DATA_REDIS_HOST: redis
            SPRING_DATA_REDIS_PORT: 6379

            JWT_PRIVATE_KEY_PATH: /run/secrets/hotel-jwt/private.key
            JWT_PUBLIC_KEY_PATH: /run/secrets/hotel-jwt/public.key
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - C:/Users/revel/SecretHotel:/run/secrets/hotel-jwt:ro
    postgres:
        image: postgres:17
        container_name : hotel-postgres
        restart : unless-stopped
        environment:
            POSTGRES_USER: hoteluser
            POSTGRES_PASSWORD: nejake_docasne_heslo_to_zmenime
            POSTGRES_DB: hoteldb
        volumes:
            - hotel-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U hoteluser -d hoteldb"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image : redis:8
        container_name : hotel-redis
        restart : unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    hotel-postgres-data: